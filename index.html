<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy Birthday My Love 💖</title>
    <!-- Romantic Fonts & Myanmar Font Support -->
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff2a74;
            --accent-pink: #ff75a0;
            --bg-dark: #0d020a;
            --card-w: clamp(200px, 60vw, 260px);
            --card-h: clamp(270px, 80vw, 350px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background: radial-gradient(circle at center, #2a081a 0%, #0d020a 100%);
            font-family: 'Pyidaungsu', -apple-system, sans-serif;
            color: #fff;
            touch-action: none;
        }

        /* Particle Background Canvas */
        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Main Screen Container */
        .app-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 10px;
        }

        /* Top Header */
        .top-header {
            font-size: clamp(0.85rem, 3.5vw, 1.1rem);
            color: #ffa4d2;
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 42, 116, 0.7);
            margin-top: 5px;
        }

        /* --- STEP 1: Gift Unbox Scene --- */
        .gift-scene {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gift-scene.hide {
            opacity: 0;
            transform: scale(0.2) translateY(-100px);
            pointer-events: none;
            position: absolute;
        }

        .gift-box {
            position: relative;
            width: 120px;
            height: 120px;
            cursor: pointer;
            animation: floatGift 2s infinite ease-in-out;
        }

        @keyframes floatGift {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }

        .gift-box .box-body {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff3377, #d81b60);
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(255, 42, 116, 0.6);
            position: relative;
            overflow: hidden;
        }

        .gift-box .ribbon-v {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 100%;
            background: #ffe0b2;
        }

        .gift-box .ribbon-h {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 24px;
            background: #ffe0b2;
        }

        .gift-box .bow {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 30px;
            background: #ffe0b2;
            border-radius: 50% 50% 0 0;
            box-shadow: 0 0 12px rgba(255, 224, 178, 0.8);
        }

        .tap-hint {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            padding: 8px 22px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: pulseHint 1.5s infinite alternate;
        }

        @keyframes pulseHint {
            0% { opacity: 0.6; transform: scale(0.96); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        /* --- STEP 2: 3D Coverflow Carousel --- */
        .content-scene {
            display: none;
            width: 100%;
            max-width: 480px;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .content-scene.show {
            display: flex;
            opacity: 1;
        }

        .birthday-title {
            font-family: 'Sacramento', 'Pyidaungsu', cursive;
            font-size: clamp(2rem, 7vw, 2.8rem);
            color: #ffffff;
            text-shadow: 0 0 10px #ff2a74, 0 0 20px #ff2a74;
            text-align: center;
            margin-top: 5px;
        }

        /* 3D Stage & Carousel */
        .carousel-stage {
            width: 100%;
            height: var(--card-h);
            perspective: 1000px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: auto 0;
        }

        .carousel-track {
            position: relative;
            width: var(--card-w);
            height: var(--card-h);
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Polaroid Style Photo Card */
        .photo-card {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            background: #ffffff;
            padding: 12px 12px 18px 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
            cursor: pointer;
        }

        .photo-frame {
            width: 100%;
            height: 72%;
            border-radius: 10px;
            overflow: hidden;
            background: #1a1a1a;
            position: relative;
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .caption-pill {
            width: 100%;
            background: rgba(255, 240, 245, 0.9);
            border: 1px solid rgba(255, 42, 116, 0.3);
            border-radius: 20px;
            padding: 6px 10px;
            text-align: center;
            font-size: clamp(0.72rem, 2.8vw, 0.85rem);
            color: #d81b60;
            font-weight: bold;
            line-height: 1.3;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        /* Bottom Controls */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .circle-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 42, 116, 0.9);
            border: none;
            color: #fff;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 42, 116, 0.5);
            transition: transform 0.2s, background 0.2s;
        }

        .circle-btn:active {
            transform: scale(0.9);
            background: var(--dark-pink);
        }

        .counter-badge {
            font-size: 0.9rem;
            color: #ffb3d1;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(0,0,0,0.3);
            padding: 4px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="app-container">
        <div class="top-header">✨ ချစ်သူ့အတွက် အထူးသီးသန့် ✨</div>

        <!-- Step 1: Unbox Scene -->
        <div class="gift-scene" id="giftScene">
            <div class="gift-box" id="giftBox">
                <div class="bow"></div>
                <div class="gift-box box-body">
                    <div class="ribbon-v"></div>
                    <div class="ribbon-h"></div>
                </div>
            </div>
            <div class="tap-hint">လက်ဆောင်ဗူးလေးကို နှိပ်လိုက်ပါဗျ 🎁</div>
        </div>

        <!-- Step 2: 3D Coverflow Slider -->
        <div class="content-scene" id="contentScene">
            <div class="birthday-title">Happy Birthday Ma Ma Shwe Yee 💖</div>

            <div class="carousel-stage" id="stage">
                <div class="carousel-track" id="carouselTrack">
                    <!-- Cards will be dynamically created here -->
                </div>
            </div>

            <div class="controls-bar">
                <button class="circle-btn" id="prevBtn">&#10094;</button>
                <div class="counter-badge" id="counterBadge">1 / 5</div>
                <button class="circle-btn" id="nextBtn">&#10095;</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Audio Synthesizer (BGM Music) ---
        class RomanticBGM {
            constructor() {
                this.audioCtx = null;
                this.isPlaying = false;
            }

            init() {
                if (!this.audioCtx) {
                    this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            play() {
                if (this.isPlaying) return;
                this.init();
                this.isPlaying = true;

                const notes = [
                    { f: 261.63, d: 0.4 }, { f: 261.63, d: 0.4 },
                    { f: 293.66, d: 0.8 }, { f: 261.63, d: 0.8 },
                    { f: 349.23, d: 0.8 }, { f: 329.63, d: 1.2 },
                    { f: 261.63, d: 0.4 }, { f: 261.63, d: 0.4 },
                    { f: 293.66, d: 0.8 }, { f: 261.63, d: 0.8 },
                    { f: 392.00, d: 0.8 }, { f: 349.23, d: 1.2 }
                ];

                let now = this.audioCtx.currentTime + 0.1;
                let totalDuration = 0;

                notes.forEach(n => {
                    const osc = this.audioCtx.createOscillator();
                    const gain = this.audioCtx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(n.f, now);

                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + n.d - 0.05);

                    osc.connect(gain);
                    gain.connect(this.audioCtx.destination);

                    osc.start(now);
                    osc.stop(now + n.d);

                    now += n.d;
                    totalDuration += n.d;
                });

                setTimeout(() => {
                    this.isPlaying = false;
                    if (document.getElementById('contentScene').classList.contains('show')) {
                        this.play();
                    }
                }, totalDuration * 1000);
            }
        }

        const bgm = new RomanticBGM();

        // --- 2. Floating Confetti & Hearts Canvas Animation ---
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -20;
                this.size = Math.random() * 8 + 6;
                this.speedY = Math.random() * 1.5 + 0.8;
                this.speedX = (Math.random() - 0.5) * 1.2;
                this.rotation = Math.random() * 360;
                this.rotSpeed = (Math.random() - 0.5) * 2;
                this.isHeart = Math.random() > 0.4;
                this.color = `hsl(${Math.random() * 40 + 330}, 100%, 65%)`;
                this.opacity = Math.random() * 0.7 + 0.3;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;
                this.rotation += this.rotSpeed;
                if (this.y > canvas.height + 20) this.reset();
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;

                if (this.isHeart) {
                    ctx.beginPath();
                    const d = this.size;
                    ctx.moveTo(0, 0);
                    ctx.bezierCurveTo(-d/2, -d/2, -d, d/3, 0, d);
                    ctx.bezierCurveTo(d, d/3, d/2, -d/2, 0, 0);
                    ctx.fill();
                } else {
                    ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                }
                ctx.restore();
            }
        }

        for (let i = 0; i < 40; i++) {
            particles.push(new Particle());
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(render);
        }
        render();

        // --- 3. Cards Data (Images & Burmese Captions) ---
        // မိမိကြိုက်နှစ်သက်ရာ Photo Image URL များကို အလွယ်တကူ လဲလှယ်နိုင်ပါသည်။
        const cardsData = [
            {
                img: "1.jpg",
                text: "ပျော်ရွှင်ဖွယ်မွေးနေ့လေးဖြစ်ပါစေ အချစ်ရေ 💖"
            },
            {
                img: "2.jpg",
                text: "မင်းလေးရဲ့ အပြုံးတွေက ငါ့အတွက် အလှပဆုံးပါပဲ 🌸"
            },
            {
                img: "3.jpg",
                text: "ဘဝရဲ့ ခရီးလမ်းမှာ အတူတူ အမြဲရှိနေပေးမယ်နော် 💍"
            },
            {
                img: "4.jpg",
                text: "စိတ်၏ချမ်းသာခြင်း၊ ကိုယ်၏ကျန်းမာခြင်းနဲ့ ပြည့်စုံပါစေ... 🌟"
            },
            {
                img: "5.jpg",
                text: "ကမ္ဘာပေါ်မှာ အပျော်ရွှင်ဆုံး မိန်းကလေး ဖြစ်ပါစေ 🥰"
            }
        ];

        let currentIndex = 0;
        const track = document.getElementById('carouselTrack');

        function createCards() {
            track.innerHTML = '';
            cardsData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <div class="photo-frame">
                        <img src="${item.img}" alt="Birthday Photo">
                    </div>
                    <div class="caption-pill">${item.text}</div>
                `;
                card.addEventListener('click', () => {
                    currentIndex = index;
                    updateCarousel();
                });
                track.appendChild(card);
            });
            updateCarousel();
        }

        function updateCarousel() {
            const cards = document.querySelectorAll('.photo-card');
            const total = cards.length;

            cards.forEach((card, i) => {
                const offset = i - currentIndex;
                const absOffset = Math.abs(offset);

                if (absOffset > 2) {
                    card.style.opacity = '0';
                    card.style.pointerEvents = 'none';
                    return;
                }

                card.style.opacity = '1';
                card.style.pointerEvents = 'auto';

                const translateX = offset * 115;
                const translateZ = -absOffset * 110;
                const rotateY = offset * -25;

                card.style.transform = `translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${rotateY}deg)`;
                card.style.zIndex = 100 - absOffset;
            });

            document.getElementById('counterBadge').innerText = `${currentIndex + 1} / ${total}`;
        }

        // --- 4. Event Handlers & Touch Swipe Support ---
        document.getElementById('giftBox').addEventListener('click', () => {
            document.getElementById('giftScene').classList.add('hide');
            setTimeout(() => {
                document.getElementById('contentScene').classList.add('show');
                bgm.play();
            }, 300);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % cardsData.length;
            updateCarousel();
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentIndex = (currentIndex - 1 + cardsData.length) % cardsData.length;
            updateCarousel();
        });

        // Touch Swipe Gesture Handling
        let touchStartX = 0;
        let touchEndX = 0;
        const stage = document.getElementById('stage');

        stage.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        stage.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 40;
            if (touchStartX - touchEndX > swipeThreshold) {
                // Swipe Left -> Next Card
                currentIndex = (currentIndex + 1) % cardsData.length;
                updateCarousel();
            } else if (touchEndX - touchStartX > swipeThreshold) {
                // Swipe Right -> Prev Card
                currentIndex = (currentIndex - 1 + cardsData.length) % cardsData.length;
                updateCarousel();
            }
        }

        // Initialize App
        createCards();
    </script>
</body>
</html>
